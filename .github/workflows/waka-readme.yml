name: Waka Readme Stats

on:
  schedule:
    - cron: '30 18 * * *' # 매일 03:30 KST (UTC 18:30)
  workflow_dispatch:

permissions:
  contents: write

# README를 고치는 봇 워크플로끼리 동시에 push하지 않도록 한 줄로 세움
concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 코딩 시간·커밋 시간대·요일·언어·에디터만 남기고, 겹치거나 무거운 섹션은 끔
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"          # 비공개 프로젝트명 노출 방지
          SHOW_TIMEZONE: "False"
          SHOW_LANGUAGE_PER_REPO: "False"  # 위쪽 GitHub 언어 카드와 중복
          SHOW_LOC_CHART: "False"          # 실행 시간이 오래 걸리는 차트
          SHOW_SHORT_INFO: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_UPDATED_DATE: "True"
          # "This Week I Spent My Time On"(언어·에디터)와 "AI Coding This Week" 섹션 제거
          SHOW_LANGUAGE: "False"
          SHOW_EDITORS: "False"
          SHOW_AI_CODING: "False"
